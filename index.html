<html lang="ru">

<head>
    <meta charset="UTF-8">

    <style>
        /* ===================================================== 1. �������� ��������� ===================================================== */
        :root {
            --background: #000000;
            --main-color: rgb(100, 0, 0);
            --date-size: 3.25rem;
            --clock-size: 6.2rem;
            --seconds-size: 4rem;
            --date-gap: 40px;
            --battery-gap: 34px;
            /* ��������� � �������� ��������� �������� */
            --move-x: 20px;
            --move-y: 20px;
            --move-time: 30s;
        }

        /* ===================================================== 2. ������� ����� ===================================================== */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--background);
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Courier New", Courier, monospace;
        }

        /* ===================================================== 3. ������� ����� ===================================================== */
        #interactive-zone {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100%;
            margin-top: -20px;
            text-align: center;
            outline: none;
            will-change: transform;
        }

        /* ===================================================== 4. ���� ===================================================== */
        .date-row {
            color: var(--main-color);
            font-size: var(--date-size);
            font-weight: bold;
            letter-spacing: -2px;
            white-space: nowrap;
            margin-bottom: var(--date-gap);
            transform: translateY(5px);
            text-shadow: 0 0 12px var(--main-color), 0 0 25px var(--main-color);
            transition: color 1s linear, text-shadow 1s linear;
        }

        /* ===================================================== 5. �������� ���� ===================================================== */
        .clock {
            display: flex;
            justify-content: center;
            align-items: baseline;
            white-space: nowrap;
            color: var(--main-color);
            font-size: var(--clock-size);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
            text-shadow: 0 0 18px var(--main-color), 0 0 38px var(--main-color);
            transition: color 1s linear, text-shadow 1s linear;
        }

        .time-main {
            display: inline-block;
            white-space: nowrap;
        }

        /* ��������� */
        #clock-colon {
            display: inline-block;
            visibility: visible;
        }

        /* ������� ���������, ����� ������� ������ */
        #clock-colon.blink {
            animation: colonBlink 1s steps(2, start) infinite;
        }

        @keyframes colonBlink {
            to {
                visibility: hidden;
            }
        }

        /* ������� */
        .seconds {
            display: inline-block;
            font-size: var(--seconds-size);
            font-weight: 600;
            letter-spacing: 0;
            line-height: 1;
            margin-left: 0.08em;
            color: inherit;
            text-shadow: inherit;
        }

        .seconds[hidden] {
            display: none;
        }

        /* ===================================================== 6. ��������� ������������ ===================================================== */
        .battery-info {
            margin-top: var(--battery-gap);
            transform: translateY(-5px);
            font-family: Arial, sans-serif;
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing:
                1px;
            color: var(--main-color);
            text-shadow: 0 0 12px var(--main-color), 0 0 25px var(--main-color);
            transition: color 1s linear, text-shadow 1s linear;
        }

        /* ===================================================== 7. ������ ===================================================== /* =====================================================
   7. ������ ��������� ������������
   ������ ������ ������������ ����������
   ===================================================== */

        .battery-status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 170px;
            margin-top: 24px;
        }

        /* ����� ��������� ������� */
        .battery-dot {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: var(--main-color);
            box-shadow:
                0 0 12px var(--main-color),
                0 0 25px var(--main-color);
            opacity: 0;
            transition:
                opacity 0.3s linear,
                background 1s linear,
                box-shadow 1s linear;
        }

        /* ������ ��� ������� ������������ */
        #battery-discharging {
            width: 18px;
            height: 18px;
            transform: translateY(-17mm);
        }

        /* ������ ��� ������� ������������ */
        #battery-charging {
            width: 18px;
            height: 18px;
            transform: translateY(-17mm);
        }

        /* ���������� ������ �������� ������ */
        .battery-dot.active {
            opacity: 1;
        }

        =====================================================8. ��������� �����=====================================================*/ @media (max-width: 700px) {
            :root {
                --date-size: 2.5rem;
                --clock-size: 4.2rem;
                --seconds-size: 0.6em;
                --date-gap: 24px;

            }

            .date-row {
                letter-spacing: -2;
            }
        

        @media (max-width: 360px) {
            :root {
                --date-size: 2.25rem;
                --clock-size: 2.3rem;
                --date-gap: 18px;
                --battery-gap: 24px;
            }
        }

        @media (orientation: landscape) {
            .battery-info {
                font-size: 2.8rem;
            }
        }/* АЛЬБОМНЫЙ РЕЖИМ — РАЗМЕР ЦИФР ЧАСОВ */
@media (orientation: landscape) {
    #clock {

}
/* Телефон: вертикальное положение */
@media (max-width: 800px) and (orientation: portrait) {
    :root {
        --date-size: 2.5rem;

        --battery-gap: 24px;
    }
}

/* Телефон: горизонтальное положение */
@media (max-width: 800px) and (orientation: landscape) {
    :root {
        --date-size: 3.5rem;
        --clock-size: 10.2rem;
        --seconds-size: 0.6em;
        --date-gap: 24px;
        --battery-gap: 24px;
    }
}


        @media (orientation: portrait) {

<body>
    <!-- ===================================================== 9. ��������� ����� ===================================================== -->
    <div id="interactive-zone">
        <div id="date" class="date-row"> 1-Mo : 00.00.0000 </div>
        <div id="clock" class="clock"> <span id="time-main" class="time-main"> <span id="hours">00</span><span
                    id="clock-colon" class="blink">:</span><span id="minutes">00</span> </span> <span id="seconds"
                class="seconds" hidden>00</span> </div>
        <div id="battery" class="battery-info"> BATTERY: -- </div>
        <div class="battery-status">
            <div id="battery-discharging" class="battery-dot active" aria-label="����������� �����������"> </div>
            <div id="battery-charging" class="battery-dot" aria-label="����������� ����������"> </div>
        </div>
    </div>
    <script> "use strict"; /* ===================================================== 10. �������� �������� ===================================================== */ const dateElement = document.getElementById("date"); const clockElement = document.getElementById("clock"); const hoursElement = document.getElementById("hours"); const minutesElement = document.getElementById("minutes"); const colonElement = document.getElementById("clock-colon"); const secondsElement = document.getElementById("seconds"); const batteryElement = document.getElementById("battery"); const interactiveZone = document.getElementById("interactive-zone"); const dischargingDot = document.getElementById("battery-discharging"); const chargingDot = document.getElementById("battery-charging"); /* ===================================================== 11. ��� ������ ===================================================== */ const daysOfWeek = ["7-Sun", "1-Mo", "2-Tue", "3-Wed", "4-Thu", "5-Fri", "6-Sat"]; /* ===================================================== 12. ������������ ������ ===================================================== */ let secondsVisible = false; function toggleSeconds() { secondsVisible = !secondsVisible; secondsElement.hidden = !secondsVisible; /* ������� ������ � ��������� ������. ������� ����� � ��������� ���������. */ colonElement.classList.toggle("blink", !secondsVisible); } /* ===================================================== 13. ���� � ����� ===================================================== */ function updateClock() { const now = new Date(); const hours = String(now.getHours()).padStart(2, "0"); const minutes = String(now.getMinutes()).padStart(2, "0"); const seconds = String(now.getSeconds()).padStart(2, "0"); hoursElement.textContent = hours; minutesElement.textContent = minutes; secondsElement.textContent = seconds; const dayName = daysOfWeek[now.getDay()]; const day = String(now.getDate()).padStart(2, "0"); const month = String(now.getMonth() + 1).padStart(2, "0"); const year = now.getFullYear(); dateElement.textContent = `${dayName} : ${day}.${month}.${year}`; } /* ===================================================== 14. �������� ����� ������������ ===================================================== */ const colorStops = [{ level: 0.00, r: 100, g: 0, b: 0 }, { level: 0.05, r: 255, g: 0, b: 0 }, { level: 0.17, r: 255, g: 100, b: 0 }, { level: 0.30, r: 255, g: 230, b: 0 }, { level: 0.42, r: 0, g: 255, b: 0 }, { level: 0.60, r: 0, g: 255, b: 190 }, { level: 0.72, r: 0, g: 100, b: 255 }, { level: 0.85, r: 100, g: 0, b: 255 }, { level: 1.00, r: 190, g: 0, b: 255 }]; /* ===================================================== 15. ������������ ����� ===================================================== */ function interpolateColor(level) { level = Math.max(0, Math.min(1, level)); let left = colorStops[0]; let right = colorStops[colorStops.length - 1]; for (let i = 0; i < colorStops.length - 1; i++) { if (level >= colorStops[i].level && level <= colorStops[i + 1].level) { left = colorStops[i]; right = colorStops[i + 1]; break; } } const range = right.level - left.level; const progress = range === 0 ? 0 : (level - left.level) / range; const r = Math.round(left.r + (right.r - left.r) * progress); const g = Math.round(left.g + (right.g - left.g) * progress); const b = Math.round(left.b + (right.b - left.b) * progress); return { r, g, b, css: `rgb(${r}, ${g}, ${b})` }; } /* ===================================================== 16. ���������� ����� ===================================================== */ function updateClockColor(level) { const percent = Math.round(level * 100); const color = interpolateColor(level); const glowStrong = `0 0 18px rgba(${color.r}, ${color.g}, ${color.b}, 0.85)`; const glowSoft = `0 0 38px rgba(${color.r}, ${color.g}, ${color.b}, 0.4)`; const glow = `${glowStrong}, ${glowSoft}`; document.documentElement.style.setProperty("--main-color", color.css); clockElement.style.color = color.css; clockElement.style.textShadow = glow; secondsElement.style.color = color.css; secondsElement.style.textShadow = glow; dateElement.style.color = color.css; dateElement.style.textShadow = glow; batteryElement.style.color = color.css; batteryElement.style.textShadow = glow; dischargingDot.style.background = color.css; dischargingDot.style.boxShadow = glow; chargingDot.style.background = color.css; chargingDot.style.boxShadow = glow; batteryElement.textContent = `${percent}%`; } /* ===================================================== 17. ��������� ������� ===================================================== */ function updateBatteryStatus(battery) { const isCharging = battery.charging; dischargingDot.classList.toggle("active", !isCharging); chargingDot.classList.toggle("active", isCharging); } /* ===================================================== 18. ��������� ������ ������������ ===================================================== */ let currentBatteryLevel = 1; async function initBattery() { if (!("getBattery" in navigator)) { batteryElement.textContent = "�������: ��� ������"; currentBatteryLevel = 0.5; updateClockColor(currentBatteryLevel); dischargingDot.classList.remove("active"); chargingDot.classList.remove("active"); return; } try { const battery = await navigator.getBattery(); currentBatteryLevel = battery.level; updateClockColor(currentBatteryLevel); updateBatteryStatus(battery); battery.addEventListener("levelchange", () => { currentBatteryLevel = battery.level; updateClockColor(currentBatteryLevel); }); battery.addEventListener("chargingchange", () => { currentBatteryLevel = battery.level; updateClockColor(currentBatteryLevel); updateBatteryStatus(battery); }); } catch (error) { console.log("�� ������� �������� ������� �������.", error); batteryElement.textContent = "�������: ��� ������"; currentBatteryLevel = 0.5; updateClockColor(currentBatteryLevel); dischargingDot.classList.remove("active"); chargingDot.classList.remove("active"); } } /* ===================================================== 19. ������ OLED � ������� �������� �������� ===================================================== */ let animationFrameId = null; let animationStartTime = null; function startScreenProtection() { if (animationFrameId !== null) { cancelAnimationFrame(animationFrameId); animationFrameId = null; } animationStartTime = null; const rootStyles = getComputedStyle(document.documentElement); const amplitudeX = parseFloat(rootStyles.getPropertyValue("--move-x")) || 0; const amplitudeY = parseFloat(rootStyles.getPropertyValue("--move-y")) || 0; const durationText = rootStyles.getPropertyValue("--move-time").trim(); let durationMs = 30000; if (durationText.endsWith("ms")) { durationMs = parseFloat(durationText); } else if (durationText.endsWith("s")) { durationMs = parseFloat(durationText) * 1000; } if (!Number.isFinite(durationMs) || durationMs <= 0) { durationMs = 30000; } function animate(timestamp) { if (animationStartTime === null) { animationStartTime = timestamp; } const elapsed = timestamp - animationStartTime; const progress = (elapsed % durationMs) / durationMs; const angle = progress * Math.PI * 2; const x = amplitudeX * Math.sin(angle); const y = -amplitudeY * Math.cos(angle); interactiveZone.style.transform = `translate3d(${x}px, ${y}px, 0)`; animationFrameId = requestAnimationFrame(animate); } animationFrameId = requestAnimationFrame(animate); } startScreenProtection(); /* ===================================================== 20. ���������� ����� � WAKE LOCK ===================================================== */ let wakeLock = null; async function enableWakeLock() { if (!("wakeLock" in navigator)) { return; } if (wakeLock !== null && !wakeLock.released) { return; } try { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } catch (error) { wakeLock = null; console.log("Wake Lock ����������:", error); } } document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { enableWakeLock(); if (animationFrameId === null) { startScreenProtection(); } } }); /* ��������� ������� ��� ����������� � �������� */ window.addEventListener("pageshow", () => { enableWakeLock(); }); /* ===================================================== 21. ������������� ����� ===================================================== */ async function toggleFullscreen() { try { if (!document.fullscreenElement) { await document.documentElement.requestFullscreen(); } else { await document.exitFullscreen(); } } catch (error) { console.log("�� ������� �������� ������������� �����:", error); } } /* ===================================================== 22. ������� � ������� ������� ===================================================== */ /* ������� ������� � �������� ��� ������ �������. ������� ������� � �������� ��� ��������� ������ �����. */ let tapCount = 0; let tapTimer = null; const tapDelay = 350; function handleTap(event) { if (event.pointerType === "mouse" && event.button !== 0) { return; } tapCount++; clearTimeout(tapTimer); tapTimer = setTimeout(async () => { const count = tapCount; tapCount = 0; if (count === 3) { toggleSeconds(); } else if (count === 2) { await toggleFullscreen(); } }, tapDelay); } document.addEventListener("pointerup", handleTap); /* ===================================================== 23. ������ ����� ===================================================== */ updateClock(); setInterval(updateClock, 200); initBattery(); enableWakeLock(); </script>
